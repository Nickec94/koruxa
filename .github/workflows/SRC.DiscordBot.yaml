name: KoruxaBot

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: nixonjoshua98/shared-workflows/.github/workflows/Template.Build.Docker.ACR.yaml@master
    with:
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUB_ID }}
      image_registry: ${{ vars.AZURE_REGISTRY }}
      image_repository: koruxa.discordbot
      dockerfile_path: ./src/SRC.DiscordBot/Dockerfile
      build_context: ./src/

  deploy:
    needs:
      - build
    uses: nixonjoshua98/shared-workflows/.github/workflows/Template.GitOps.Dispatch.yaml@master
    with:
      infra_event: koruxa.discordbot
      image: ${{ needs.build.outputs.image }}
      environment: Production
    secrets:
      GITOPS_REPO_PAT: ${{ secrets.GITOPS_REPO_PAT }}
